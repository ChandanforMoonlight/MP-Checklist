<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#75052f"><title>MP Checklist — Mobile Login Test</title>
<style>:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#2b1821;background:#fff8fb;font-size:14px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;transition:transform .18s ease,box-shadow .2s ease,background .2s ease}button:hover{transform:translateY(-2px)}button:active{transform:scale(.97)}h1{font-size:28px;margin:0 0 5px}h2{font-size:18px;margin:0 0 17px}p{margin:7px 0}small,.small{font-size:12px}.muted{color:#877682}.bad{color:#bb1643}.good{color:#177d4b}.brand{font-size:19px;font-weight:850;letter-spacing:-.4px;color:white}.brand small{display:block;margin-left:32px;font-size:9px;letter-spacing:2px;color:#e8aabd}.brand.big{color:#75052f;font-size:30px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#56001d,#a20a43);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;color:white;box-shadow:0 8px 22px #5e122429}.top-right{display:flex;align-items:center;gap:16px}.layout{display:flex;min-height:calc(100vh - 75px)}.nav{width:228px;flex-shrink:0;border-right:1px solid #f0dbe3;padding:22px 13px;background:#fffafc;display:flex;flex-direction:column;gap:10px}.tab{padding:15px 14px;border:0;border-radius:12px;background:transparent;text-align:left;font-weight:700;color:#766671}.tab:hover,.tab.active{background:#f6e3eb;color:#75052f}.tab.active{box-shadow:inset 3px 0 #75052f}.main{flex:1;min-width:0;max-width:1600px;padding:28px 30px 60px}.page-head{margin-bottom:25px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px;margin-bottom:22px}.metric{background:#fff;border:1px solid #ead7df;border-top:4px solid #81042e;border-radius:19px;padding:24px 17px;box-shadow:0 10px 24px #75213c0c;position:relative;overflow:hidden}.metric:after{content:'';position:absolute;width:60px;height:3px;background:#ad1450;bottom:0;left:0;animation:travel 5s linear infinite alternate}.metric-num{font-size:37px;font-weight:850;color:#75052f;margin-bottom:8px}.panel{background:white;border:1px solid #eddce3;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 9px 28px #75052f0a}.card{border:1px solid #f1e0e6;background:#fff;border-radius:13px;padding:14px 16px}.task{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px;animation:rise .3s both}.task strong{line-height:1.5}.item{border-bottom:1px solid #f2e5eb;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px}.item:last-child{border-bottom:0}.controls{display:flex;gap:12px;margin-bottom:17px}.toggle{border:1px solid #e6c9d5;border-radius:10px;padding:10px 16px;background:#fff;color:#81042e;font-weight:700}.toggle.active,.primary{background:#76052e;color:white;border:1px solid #76052e}.primary,.outline{border-radius:10px;padding:12px 17px;font-weight:700}.primary:hover{background:#a00b43;box-shadow:0 8px 18px #75052f28}.outline{color:#fff;border:1px solid #ffffff90;background:transparent}.pill{border-radius:20px;padding:7px 10px;background:#f5dbe6;color:#780b35;font-size:11px;font-weight:800}.top .pill{background:#ffffff23;color:white}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));align-items:end;gap:15px}.form-grid label,.auth label{font-weight:700;color:#6d4355}.form-grid input,.form-grid select,.auth input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #dfc2d0;border-radius:10px;outline-color:#900941;background:white}.auth-wrap{display:grid;place-items:center;min-height:100vh;padding:15px;background:radial-gradient(circle at 10% 0%,#f4d4e2,#fff 60%)}.auth{max-width:440px;width:100%;padding:37px}.auth label{display:block;margin:24px 0 18px}.auth .wide{width:100%}.auth .muted{line-height:1.7}.warning{color:#a72445}.profile{display:flex;align-items:center;gap:22px;background:linear-gradient(115deg,#6b062b,#ae2b59);color:white}.avatar{height:80px;width:80px;border-radius:23px;background:#ffffff30;display:grid;place-items:center;font-size:36px;font-weight:800}.profile .pill{background:#ffffff33;color:white}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.details>div{padding:14px;border-radius:12px;background:#fff6fa}.details strong{display:block;margin-top:9px}.score{text-align:center;padding:45px}.score-number{font-size:75px;font-weight:850;color:#75052f}.score-number span{font-size:27px}.text-btn{border:0;background:transparent;font-weight:700}.toast{position:fixed;bottom:25px;right:22px;padding:14px 24px;background:#75052f;color:white;border-radius:12px;box-shadow:0 10px 30px #0003;z-index:10}.toast.error{background:#bd234b}.animate{animation:rise .35s ease both}.loading{padding:40px;color:#99758a}.boot{display:grid;place-items:center;min-height:100vh;color:#75052f;font-size:32px;font-weight:900}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes travel{from{left:-65px}to{left:100%}}@media(max-width:1020px){.metrics{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:14px}.top-right{gap:8px;font-size:11px}.brand{font-size:15px}.brand small{font-size:7px}.layout{display:block}.nav{width:100%;padding:12px;display:flex;flex-direction:row;gap:8px;overflow-x:auto;border-bottom:1px solid #eddce3}.tab{flex-shrink:0;padding:10px 13px;white-space:nowrap}.main{padding:20px 12px 40px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:17px 12px}.metric-num{font-size:30px}.panel{padding:17px}.form-grid{grid-template-columns:1fr}.task{align-items:flex-start;flex-direction:column}.details{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}


/* Mobile navigation: every tab stays visible without horizontal clipping. */
@media(max-width:700px){
  html,body,#app{width:100%;max-width:100%;overflow-x:hidden}
  .top{padding:12px;gap:8px;flex-wrap:wrap}
  .top-right{min-width:0;max-width:100%;flex-wrap:wrap;justify-content:flex-end;gap:7px}
  .top-right>span:not(.pill){overflow-wrap:anywhere;max-width:140px}
  .top .outline{padding:8px 10px;font-size:12px}
  .layout{width:100%;min-width:0}
  .nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:8px;padding:10px 12px;overflow:visible;box-sizing:border-box}
  .tab{display:flex;justify-content:center;align-items:center;min-width:0;min-height:43px;white-space:normal;overflow-wrap:anywhere;word-break:normal;text-align:center;padding:10px 6px;font-size:13px;line-height:1.25;border:1px solid #e9d3df}
  .tab.active{box-shadow:inset 0 -3px #75052f}
  .main{width:100%;max-width:100%;min-width:0;padding:17px 12px 40px}
  .panel,.card{max-width:100%;min-width:0}
  .item{flex-wrap:wrap;overflow-wrap:anywhere}
  .item>*{max-width:100%;overflow-wrap:anywhere}
  .task>div{min-width:0;max-width:100%;overflow-wrap:anywhere}
  .page-head h1{font-size:23px}
  .auth{padding:24px 18px}
}
@media(max-width:360px){.tab{font-size:12px;min-height:42px}.metric-num{font-size:24px}.brand{font-size:13px}.top-right{font-size:10px}}
</style></head><body>
<div id="app"><div class="boot">MP Checklist</div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';

const sb = createClient("https://tmvqzrhikafeglhvipju.supabase.co","sb_publishable_J_ydAnNgk0wiNcTP6kR2iw_igVufjR6",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.querySelector('#app');
const state={user:null,profile:null,employees:[],page:'Dashboard'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const first=()=>today().slice(0,7)+'-01';
const monthEnd=()=>{const [y,m]=first().split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)};
const fmt=v=>v?String(v).slice(0,10).split('-').reverse().join('-'):'—';
const admin=()=>state.profile?.app_role==='admin';
const notify=(msg,err=false)=>{let el=document.querySelector('#toast');if(!el){el=document.createElement('div');el.id='toast';document.body.append(el)}el.textContent=msg;el.className='toast'+(err?' error':'');setTimeout(()=>el.remove(),5000)};
async function checked(q){const {data,error}=await q;if(error)throw error;return data;}
async function loadTasks(from=first(),to=monthEnd(),filter={}){let out=[];for(let p=0;p<50;p++){let q=sb.from('mp_tasks').select('id,assignee_name,assignee_email,task_name,planned_on,actual_on,is_done,status,frequency,source_task_id').gte('planned_on',from).lte('planned_on',to).order('planned_on').range(p*1000,p*1000+999);if(filter.email)q=q.eq('assignee_email',filter.email);const part=await checked(q);out.push(...part);if(part.length<1000)break;}return out;}
function nav(){const tabs=admin()?['Dashboard','Tasks','Employees','Holidays','Reports','Profile']:['Dashboard','My Tasks','Holidays','Profile'];app.innerHTML=`<header class="top"><div class="brand">✦ &nbsp; MP Checklist <small>MALIK POLYCHEM</small></div><div class="top-right"><span class="pill">${esc(state.profile.app_role.toUpperCase())}</span><span>${esc(state.profile.full_name)}</span><button id="signout" class="outline">Sign out</button></div></header><div class="layout"><aside class="nav">${tabs.map(t=>`<button data-page="${esc(t)}" class="tab ${t===state.page?'active':''}">${esc(t)}</button>`).join('')}</aside><main class="main" id="view"></main></div>`;document.querySelector('#signout').onclick=async()=>{await sb.auth.signOut();state.profile=null;state.user=null;login()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;nav();show()});}
function login(){app.innerHTML=`<div class="auth-wrap"><section class="auth panel animate"><div class="brand big">✦ MP Checklist</div><p class="muted">Malik Polychem · Secure Employee Login</p><form id="login"><label>Email<input type="email" name="email" required autocomplete="username" placeholder="name@company.com"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary wide">Sign in</button></form><p class="small muted">No Google Apps Script or Google Drive redirect.</p></section></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Signing in…';const f=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error){notify(error.message,true);b.disabled=false;b.textContent='Sign in';return}await boot()};}
async function boot(){try{const {data:{user},error}=await sb.auth.getUser();if(error||!user){login();return}state.user=user;state.profile=await checked(sb.from('mp_employees').select('id,full_name,email,department,app_role').eq('auth_user_id',user.id).single());state.employees=admin()?await checked(sb.from('mp_employees').select('id,full_name,email,department,app_role').order('full_name')):[state.profile];nav();await show();}catch(e){app.innerHTML=`<div class="auth-wrap"><section class="panel auth"><h2>Unable to open account</h2><p class="warning">${esc(e.message)}</p><p>Check that your Supabase Auth account is linked to MP Checklist employees.</p><button class="primary" id="retry">Sign out</button></section></div>`;document.querySelector('#retry').onclick=async()=>{await sb.auth.signOut();login()};}}
function title(t,sub=''){return `<div class="page-head"><h1>${esc(t)}</h1><p class="muted">${esc(sub)}</p></div>`}
const status=t=>t.is_done?'Done':t.planned_on<today()?'Overdue':'Pending';
function card(t){return `<article class="task card"><div><strong>${esc(t.task_name)}</strong><p class="small muted">${esc(t.assignee_name)} · ${fmt(t.planned_on)} · ${esc(t.frequency)} · ${esc(status(t))}</p></div>${!t.is_done&&t.assignee_email?.toLowerCase()===state.profile.email.toLowerCase()?`<button class="primary" data-complete="${t.id}">Done</button>`:''}</article>`}
function bindComplete(){document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const success=await checked(sb.rpc('mp_complete_my_task',{p_task_id:Number(b.dataset.complete)}));if(!success)throw Error('Task was already done or not assigned to you');notify('Task completed');await show();}catch(e){notify(e.message,true);b.disabled=false;}})}
async function show(){const v=document.querySelector('#view');if(!v)return;v.innerHTML='<div class="loading">Loading…</div>';try{switch(state.page){case'Dashboard':return await dashboard(v);case'Tasks':case'My Tasks':return await tasks(v);case'Employees':return employees(v);case'Holidays':return await holidays(v);case'Reports':return await reports(v);case'Profile':return profile(v);}}catch(e){v.innerHTML=`<section class="panel warning">${esc(e.message)}</section>`}}
async function dashboard(v){const rows=await loadTasks(first(),monthEnd(),admin()?{}:{email:state.profile.email});const done=rows.filter(x=>x.is_done).length;const overdue=rows.filter(x=>!x.is_done&&x.planned_on<today()).length;const pending=rows.length-done;v.innerHTML=title('Dashboard','Current month · '+fmt(today()))+`<div class="metrics">${[['Total Tasks',rows.length],['Completed',done],['Pending',pending],['Overdue',overdue],['Completion %',rows.length?Math.round(done*100/rows.length)+'%':'—']].map(([a,b])=>`<article class="metric"><div class="metric-num">${b}</div><div class="small muted">${a}</div></article>`).join('')}</div><section class="panel"><h2>${admin()?'Recent team tasks':'My tasks'}</h2>${rows.filter(t=>t.planned_on<=today()).slice(-100).reverse().map(card).join('')||'<p class="muted">No tasks due yet</p>'}</section>`;bindComplete();}
async function tasks(v){const from=first(),to=monthEnd();const rows=await loadTasks(from,to,admin()?{}:{email:state.profile.email});v.innerHTML=title(admin()?'Tasks & recurring schedules':'My Tasks','Imported tasks and new task templates')+(admin()?`<section class="panel"><h2>Create a recurring task</h2><form id="create" class="form-grid"><label>Task name<input name="task_name" required></label><label>Assign employee<select name="assignee_email">${state.employees.map(e=>`<option value="${esc(e.email)}">${esc(e.full_name)}</option>`).join('')}</select></label><label>Frequency<select name="frequency"><option value="D">Daily</option><option value="W">Weekly</option><option value="M">Monthly</option></select></label><label>Start date<input type="date" name="start_date" value="${today()}" required></label><label>End date (optional)<input type="date" name="end_date"></label><label>Weekly day (0 Sunday–6 Saturday)<input type="number" name="weekday" min="0" max="6" placeholder="Only for Weekly"></label><label>Monthly day (1–31)<input type="number" name="month_day" min="1" max="31" placeholder="Only for Monthly"></label><button class="primary">Create schedule</button></form><p class="small muted">Daily skips Sundays/GH; weekly/monthly move GH dates to next working day. New tasks are generated 60 days ahead.</p></section>`:'')+`<section class="panel"><h2>Tasks this month (${rows.length})</h2>${rows.slice(0,300).map(card).join('')||'<p class="muted">No tasks this month</p>'}${rows.length>300?'<p class="small muted">Showing first 300; all included in dashboard totals</p>':''}</section>`;if(admin()){document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const freq=f.frequency;const start=f.start_date;const d=new Date(start+'T12:00:00Z');const week=f.weekday!==''?Number(f.weekday):d.getUTCDay();const month=f.month_day!==''?Number(f.month_day):d.getUTCDate();if(freq==='W'&&(week<0||week>6)||freq==='M'&&(month<1||month>31)){notify('Invalid selected weekday/month day',true);return}const obj={task_name:String(f.task_name).trim(),assignee_email:f.assignee_email,frequency:freq,start_date:start,end_date:f.end_date||null,weekday:freq==='W'?week:null,month_day:freq==='M'?month:null,holiday_policy:'next_working_day',skip_sundays:true};const b=e.target.querySelector('button');b.disabled=true;try{await checked(sb.from('mp_task_templates').insert(obj));const until=new Date(Date.parse(today()+'T00:00:00Z')+60*86400000).toISOString().slice(0,10);await checked(sb.rpc('mp_admin_generate_recurring',{p_from:today(),p_to:until}));notify('Recurring task saved and future dates generated');await show()}catch(err){notify(err.message,true);b.disabled=false}}}bindComplete();}
function employees(v){v.innerHTML=title('Employees','Imported directory (read only until user provisioning is complete)')+`<section class="panel">${state.employees.map(e=>`<div class="item"><strong>${esc(e.full_name)}</strong><span class="muted">${esc(e.email)} · ${esc(e.department||'—')} · ${esc(e.app_role)}</span></div>`).join('')}</section>`}
async function holidays(v){const rows=await checked(sb.from('mp_holidays').select('holiday_on,day_name,name,type').order('holiday_on'));v.innerHTML=title('Holidays','Existing Google Sheet holiday calendar')+`<section class="panel">${rows.map(h=>`<div class="item"><strong>${fmt(h.holiday_on)} · ${esc(h.name)}</strong><span class="pill">${esc(h.type||'')}</span></div>`).join('')}</section>`}
async function reports(v){v.innerHTML=title('Reports','Export employee tasks as CSV')+`<form id="report" class="panel form-grid"><label>Employee<select name="email">${state.employees.map(e=>`<option value="${esc(e.email)}">${esc(e.full_name)}</option>`).join('')}</select></label><label>From<input type="date" name="from" value="${first()}" required></label><label>To<input type="date" name="to" value="${monthEnd()}" required></label><button class="primary">Export CSV</button></form>`;document.querySelector('#report').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('from')>f.get('to')){notify('Invalid date range',true);return}try{const rows=await loadTasks(f.get('from'),f.get('to'),{email:f.get('email')});const data=[['Task ID','Task','Assignee','Frequency','Planned','Actual','Status'],...rows.map(t=>[t.source_task_id||t.id,t.task_name,t.assignee_email,t.frequency,fmt(t.planned_on),fmt(t.actual_on),status(t)])];const csv=data.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='MP-Checklist-Report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify(`${rows.length} tasks exported`)}catch(err){notify(err.message,true)}}}
function profile(v){const p=state.profile;v.innerHTML=title('Profile','Current signed-in account')+`<section class="panel profile"><div class="avatar">${esc(p.full_name[0])}</div><div><h2>${esc(p.full_name)}</h2><span class="pill">${esc(p.app_role.toUpperCase())}</span></div></section><section class="panel details">${[['Email',p.email],['Department',p.department],['Role',p.app_role]].map(([k,x])=>`<div><span class="muted">${k}</span><strong>${esc(x)}</strong></div>`).join('')}</section>`}
boot();

</script></body></html>
